# Local development only. Loaded explicitly by scripts/run-local.sh.
spring.application.name=searchengine-local

server.address=127.0.0.1
server.port=8080

# Local Kafka. The existing consumer expects a JSON string payload.
spring.kafka.bootstrap-servers=127.0.0.1:19092
spring.kafka.properties.security.protocol=PLAINTEXT
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=searchengine-local
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Local Redis. Data is isolated from the public demo.
spring.data.redis.host=127.0.0.1
spring.data.redis.port=16379
spring.data.redis.database=0
spring.data.redis.ssl.enabled=false
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s

# Local Elasticsearch. The current client requires a non-empty auth value.
# This is a dummy value; authentication is disabled on the local container.
elasticsearch.base.url=http://127.0.0.1:19200
elasticsearch.key=local:local
elasticsearch.index=searchengine-local

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Allow the local frontend to read Actuator responses.
management.endpoints.web.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
management.endpoints.web.cors.allowed-methods=GET

# Preserve the existing HTTP JSON mapper during the framework upgrade.
spring.http.converters.preferred-json-mapper=jackson2